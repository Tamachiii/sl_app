name: Tests
on:
  push:
    branches: [dev]
  pull_request:
  # deploy.yml calls this as its pre-publish gate, so the job definition
  # (node version, env, steps) lives in exactly one place.
  workflow_call:
    inputs:
      skip-build:
        description: >-
          Skip the placeholder-env build. The deploy pipeline sets this because
          it runs its own build with the real secrets straight after — building
          twice per deploy proves nothing the second build doesn't.
        type: boolean
        default: false

# A rapid second push supersedes the first: only the newest commit on a branch
# (or PR) is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # ~12 suites transitively import src/lib/supabase.js, which throws when
      # these are missing; CI has no .env, so placeholders are required for
      # the suite to even load. Tests mock the client and never hit the
      # network, and the real values are only injected for the deploy build.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      # The whole history, not the one commit a checkout fetches by default:
      # supabase/functions/runbook.test.js holds the "Undo" of the Edge
      # Functions page to a commit of the published main (a61f0c31f2) — that
      # it is an ancestor of origin/main, and what the two functions were in
      # it. In a checkout of one commit neither can be asked, and those tests
      # skip (two on the first run on GitHub, 2026-10-13; three since).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # What SHIPS carries no known high or critical advisory. Runtime
      # dependencies only (--omit=dev): an advisory in the build or test
      # toolchain never reaches a phone, and some have no fixed release to
      # move to, so they must not be able to hold a deploy. This step calls
      # the registry — a red run with an unchanged lockfile means a NEW
      # advisory was published, which is the point.
      - run: npm audit --omit=dev --audit-level=high
      # `npm run lint` carries a warning ceiling (--max-warnings in
      # package.json): one warning more than the count on record fails here.
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
        if: ${{ !inputs.skip-build }}

  # The DATABASE suite: supabase/schema.sql loaded into a real PostgreSQL 17
  # and exercised as anon / student / coach (RLS, triggers, RPCs). Its own job
  # so it runs alongside the unit suite rather than after it — and, being part
  # of this reusable workflow, it gates the deploy like the job above.
  #
  # No service container and no Docker: the server binaries are an npm
  # optional dependency (@embedded-postgres/linux-x64), so `npm ci` installs
  # them and the setup-node npm cache is their cache.
  #
  # Pinned to ubuntu-24.04, not ubuntu-latest: GitHub moves ubuntu-latest to
  # Ubuntu 26 from 2026-10-19, and the PostgreSQL binaries of embedded-postgres
  # have only ever been started on 24.04 there. Move it once a run on the new
  # image is green.
  db:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:db

  # The Edge Functions are Deno: outside `eslint src`, outside vitest, and
  # deployed by hand, so nothing looked at them before this job. `deno check`
  # resolves each entry point's jsr:/npm: imports and type-checks it.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Third-party action, pinned to a commit (a tag can be moved). To update:
      # git ls-remote https://github.com/denoland/setup-deno 'refs/tags/v2*',
      # and keep the version comment.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Blocking since its first green run on GitHub (run 38354023259, the
      # first publication, 2026-10-13): a function that does not type-check
      # stops the gate, and with it the deploy.
      - id: check
        # Deno adopts the nearest package.json as its own manifest and then
        # expects every `npm:` import to be in node_modules. That file belongs
        # to the Vite app; the functions are standalone, which is also how the
        # Edge runtime bundles them. Without this the check fails on
        # `npm:web-push` before it has type-checked anything.
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: deno check supabase/functions/*/index.ts
