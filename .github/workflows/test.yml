name: Tests
on:
  push:
    branches: [dev]
  pull_request:
  # deploy.yml calls this as its pre-publish gate, so the job definition
  # (node version, env, steps) lives in exactly one place.
  workflow_call:
    inputs:
      skip-build:
        description: >-
          Skip the placeholder-env build. The deploy pipeline sets this because
          it runs its own build with the real secrets straight after — building
          twice per deploy proves nothing the second build doesn't.
        type: boolean
        default: false

# A rapid second push supersedes the first: only the newest commit on a branch
# (or PR) is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # ~12 suites transitively import src/lib/supabase.js, which throws when
      # these are missing; CI has no .env, so placeholders are required for
      # the suite to even load. Tests mock the client and never hit the
      # network, and the real values are only injected for the deploy build.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
        if: ${{ !inputs.skip-build }}
