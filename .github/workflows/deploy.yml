name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
jobs:
  # The full vitest suite gates every deploy: a red suite on main must never
  # reach real students. The job definition lives in test.yml (reusable
  # workflow) so the dev/PR gate and the deploy gate can't drift apart.
  test:
    uses: ./.github/workflows/test.yml
    # The deploy job below builds with the real secrets, so that build is this
    # pipeline's build validation — no need to also build with placeholders.
    with:
      skip-build: true
  # Database first, app second. The app of a commit calls the RPCs and reads
  # the columns of the migrations written with it; that SQL is applied to
  # production by hand, and until this job nothing stopped a push to main from
  # publishing a client ahead of its database (review finding P69). The step
  # reads production's ledger, app_private.app_migrations, and fails when a
  # `required` migration of supabase/migrations/manifest.json is not in it,
  # naming each one. What to do then: docs/runbook/40-deploy.md.
  #
  # It fails closed: without the SUPABASE_DB_URL secret the ledger cannot be
  # read and the job is red — unless the repository VARIABLE
  # ALLOW_DEPLOY_WITHOUT_LEDGER_CHECK is exactly `true`. That variable stands
  # in for a secret that is not set, and for nothing else: a migration found
  # missing stops the deploy whatever it says.
  #
  # A job of its own, on purpose. SUPABASE_DB_URL is the connection string of
  # the `postgres` role: it is in the environment of one step, in a job that
  # holds no write token and runs no dependency's install script — never in
  # the job that builds and publishes.
  migrations:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # --ignore-scripts: the check needs `pg`, which is plain JavaScript.
      - run: npm ci --ignore-scripts
      - name: Every required migration is in the ledger of production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALLOW_DEPLOY_WITHOUT_LEDGER_CHECK: ${{ vars.ALLOW_DEPLOY_WITHOUT_LEDGER_CHECK }}
        run: node scripts/check-migrations.mjs --verify
  deploy:
    # Both, by name: the tests and the ledger. A job that is skipped or red
    # in `needs` keeps this one from starting.
    needs: [test, migrations]
    runs-on: ubuntu-latest
    # This job reads what is published, adds its build to it and publishes the
    # result. Two of them at once would each publish a tree without the
    # other's build, so they take turns, and the one that is running is never
    # cut short by the one that waits.
    concurrency:
      group: publish-site
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Web Push (rest-timer + coach-feedback). When the secret is
          # unset the Profile toggle renders the "not supported" copy
          # gracefully — i.e. the build still succeeds.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          # The oldest build still allowed to run, written into version.json
          # (src/lib/buildInfo.js): an open app below it updates as soon as
          # nothing would be lost, instead of offering the update. Normally
          # absent. A repository VARIABLE: its value can be read back in the
          # settings. A value that is not the time of a build (14 digits), or
          # that is later than this build, fails the build.
          MIN_CLIENT_BUILD: ${{ vars.MIN_CLIENT_BUILD }}
      # The build goes out ON TOP of what is published, not instead of it. A
      # page that was opened before this deploy still asks for the files of
      # ITS build when a screen is opened for the first time; replaced by
      # dist/ alone, they were gone and the screen failed (review finding
      # P65). So: a copy of the published branch, then the script, which
      # copies dist/ over it, keeps the files of the two builds before this
      # one and deletes the ones only older builds had. That folder is what
      # the action publishes. docs/runbook/40-deploy.md says what the script
      # refuses and what the emergency publish does to all this.
      #
      # A branch that does not exist is a first deploy. A branch that could
      # not be read stops the job: published as if nothing were there, this
      # build would take every other build's files away.
      - name: What is published now
        run: |
          status=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || status=$?
          mkdir published
          case "$status" in
            0)
              git fetch --no-tags --depth=1 origin gh-pages
              git archive --format=tar --output="$RUNNER_TEMP/published.tar" FETCH_HEAD
              tar -xf "$RUNNER_TEMP/published.tar" -C published
              ;;
            2)
              echo "Nothing is published yet: this build is the first."
              ;;
            *)
              echo "::error title=Deploy stopped::The published branch could not be read (git ls-remote ended with $status)."
              exit 1
              ;;
          esac
      - name: This build joins the builds that are published
        run: node scripts/prune-gh-pages.mjs --site published --dist dist
      # Third-party action in a job that holds a write token: pinned to a
      # commit, because a tag can be moved to other code. To update, read the
      # new release's commit with
      #   git ls-remote https://github.com/peaceiris/actions-gh-pages 'refs/tags/v4*'
      # (the `^{}` line of an annotated tag) and keep the version comment.
      #
      # No `keep_files`: the action replaces the branch with the folder it is
      # given, and that folder already holds what stays. With `keep_files`
      # nothing the script deleted would ever leave the branch.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./published
