<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Street Lifting Coach — manage and track calisthenics training programs for coaches and athletes." />
    <!-- Status-bar / Dynamic Island strip matches the app surface per theme.
         Light = Tailwind gray-50 (the AppShell background); dark = ink-900.

         The media-less entry MUST stay last and MUST exist. A conforming UA
         takes the first entry whose media matches, so it never reaches this
         one; a UA that ignores `media` on theme-color — which is what iOS does
         for an installed web app — has nothing to read without it and paints
         the Dynamic Island strip its own default black.

         These three are only the pre-JS default. `ThemeProvider` rewrites all
         of them once it resolves the real theme, because the theme here is a
         user toggle that can disagree with the OS preference these queries
         read. -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#111110" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS colours an installed web app's status bar from THIS, not from
         theme-color and not from the manifest (both were tried; the bar stayed
         the `default` style's opaque light grey). `black-translucent` makes it
         transparent instead, so the strip is painted by the page itself —
         `html`'s background, which follows the in-app theme toggle. That is the
         only way the strip tracks the theme rather than a baked-in colour.

         Two things this depends on: `viewport-fit=cover` above, and AppShell's
         `paddingTop: env(safe-area-inset-top)` — without the padding the
         content would run underneath the clock.

         Known cost: iOS always draws the clock/battery LIGHT in this mode, so
         the light theme has pale text on a pale strip. Accepted because the
         app is dark-first. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/sl_app/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/sl_app/apple-touch-icon.png" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> at build time -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
