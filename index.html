<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Street Lifting Coach — manage and track calisthenics training programs for coaches and athletes." />
    <!-- Status-bar / Dynamic Island strip matches the app surface per theme.
         Light = Tailwind gray-50 (the AppShell background); dark = ink-900.

         The media-less entry MUST stay last and MUST exist. A conforming UA
         takes the first entry whose media matches, so it never reaches this
         one; a UA that ignores `media` on theme-color — which is what iOS does
         for an installed web app — has nothing to read without it and paints
         the Dynamic Island strip its own default black.

         These three are only the pre-JS default. `ThemeProvider` rewrites all
         of them once it resolves the real theme, because the theme here is a
         user toggle that can disagree with the OS preference these queries
         read. -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#111110" />
    <meta name="color-scheme" content="light dark" />
    <!-- No `apple-mobile-web-app-status-bar-style` here on purpose.
         `black-translucent` does make the strip follow the theme — it is the
         only thing that does — but it also leaves the initial containing block
         one status bar short of the screen, so the shell ends early and a dead
         strip appears along the bottom, lifting BottomNav off the edge. That
         was tried on-device and the strip could not be sized away.

         An installed iOS app takes the strip colour from the manifest's
         `theme_color` instead (see vite.config.js). -->

    <link rel="icon" href="/sl_app/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/sl_app/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/sl_app/apple-touch-icon.png" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> at build time -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights and families the stylesheet actually asks for.
         Archivo tops out at 800 (.sl-display); Archivo Narrow went with the
         .sl-condensed utility that nothing used. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Street Lifting Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
