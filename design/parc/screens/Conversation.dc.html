<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Conversation avec Léa Martin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="parc-tokens.css">
<link rel="stylesheet" href="ds/slcoachparc/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1E4FBF}a:hover{color:#163C93}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden">

  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-strong)">
    <a href="MessagesCoach.dc.html" class="pk-icon-btn" aria-label="Retour aux messages">
      <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; text-align: center">
      <h1 class="pk-headline">Léa Martin</h1>
      <p class="pk-small" style="margin: 0">Séance 7 prévue aujourd'hui</p>
    </div>
    <a href="#" class="pk-icon-btn" aria-label="Voir le profil de Léa" style="background: var(--blue-soft); color: var(--blue); font-size: 15px; font-weight: 700; text-decoration: none">LM</a>
  </header>

  <div role="log" aria-label="Messages avec Léa Martin" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px 16px; overflow: hidden">
    <sc-for list="{{ items }}" as="m" hint-placeholder-count="11">
      <sc-if value="{{ m.isDay }}" hint-placeholder-val="{{ false }}">
        <p class="pk-small" style="margin: 8px 0 0; align-self: center; font-weight: 600">{{ m.text }}</p>
      </sc-if>
      <sc-if value="{{ m.isTheirs }}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; align-self: flex-start; max-width: 280px; padding: 10px 14px; box-sizing: border-box; background: var(--surface); color: var(--ink); border-radius: 20px 20px 20px 6px; font-size: 16px; line-height: 1.4">{{ m.text }}</p>
      </sc-if>
      <sc-if value="{{ m.isMine }}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; align-self: flex-end; max-width: 280px; padding: 10px 14px; box-sizing: border-box; background: var(--blue); color: var(--on-blue); border-radius: 20px 20px 6px 20px; font-size: 16px; line-height: 1.4">{{ m.text }}</p>
      </sc-if>
      <sc-if value="{{ m.isVideo }}" hint-placeholder-val="{{ false }}">
        <a href="#" style="align-self: flex-start; width: 260px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--surface); color: var(--ink); border-radius: 20px 20px 20px 6px; text-decoration: none">
          <span aria-hidden="true" style="width: 64px; height: 44px; flex-shrink: 0; border-radius: var(--radius-control); background: var(--ink); display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"></path></svg>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="pk-body" style="font-weight: 600">{{ m.text }}</span><span class="pk-caption">{{ m.sub }}</span></span>
        </a>
      </sc-if>
      <sc-if value="{{ m.isCard }}" hint-placeholder-val="{{ false }}">
        <a href="Revue.dc.html" style="align-self: flex-end; width: 250px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: var(--surface); color: var(--ink); border: 2px solid var(--blue); border-radius: 20px 20px 6px 20px; text-decoration: none">
          <span style="font-size: 13px; line-height: 1.35; font-weight: 700; color: var(--blue)">Retour envoyé</span>
          <span class="pk-headline">{{ m.text }}</span>
          <span class="pk-caption">{{ m.sub }}</span>
        </a>
      </sc-if>
      <sc-if value="{{ m.isTimeLeft }}" hint-placeholder-val="{{ false }}">
        <p class="pk-small" style="margin: 0 0 4px; align-self: flex-start">{{ m.text }}</p>
      </sc-if>
      <sc-if value="{{ m.isTimeRight }}" hint-placeholder-val="{{ false }}">
        <p class="pk-small" style="margin: 0 0 4px; align-self: flex-end">{{ m.text }}</p>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 16px 28px; background: var(--surface); border-top: 1px solid var(--line-strong)">
    <button type="button" class="pk-icon-btn" aria-label="Joindre une vidéo ou une photo" style="background: var(--fill)">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 5v14M5 12h14"></path></svg>
    </button>
    <label style="flex: 1; min-width: 0; display: block">
      <span class="sr-only">Message pour Léa</span>
      <input type="text" placeholder="Écris à Léa" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" class="pk-field" style="border-radius: 999px; padding: 0 16px">
    </label>
    <button type="button" class="pk-btn pk-btn-primary" aria-label="Envoyer" onClick="{{ send }}" disabled="{{ empty }}" style="padding: 0; width: 44px; border-radius: 999px">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = {
      draft: '',
      sent: [],
      items: [
        { kind: 'day', text: 'Hier' },
        { kind: 'theirs', text: 'Séance faite. Le grip a lâché sur les muscle-ups, j’ai passé la dernière série.' },
        { kind: 'video', text: 'Série 4, muscle-up', sub: 'Vidéo de 14 s' },
        { kind: 'timeLeft', text: '18:52' },
        { kind: 'day', text: 'Aujourd’hui' },
        { kind: 'card', text: 'Haut 2, séance 6', sub: '2 écarts, vidéo revue' },
        { kind: 'mine', text: 'Bien vu de couper. Sur la vidéo, tes coudes passent trop tard.' },
        { kind: 'mine', text: 'Aujourd’hui, garde 20 kg et finis par 2 suspensions de 30 s.' },
        { kind: 'timeRight', text: '09:15, lu' },
        { kind: 'theirs', text: 'Ça marche. Je mets de la magnésie dès l’échauffement cette fois.' },
        { kind: 'timeLeft', text: '16:02' }
      ]
    };
  }
  renderVals() {
    const st = this.state;
    const send = () => {
      const text = (this.state.draft || '').trim();
      if (!text) return;
      const now = new Date();
      const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const items = this.state.items.filter((x, i, all) => !(x.kind === 'timeRight' && i === all.length - 1));
      items.push({ kind: 'mine', text: text });
      items.push({ kind: 'timeRight', text: time + ', envoyé' });
      this.setState({ items: items, draft: '' });
    };
    return {
      items: st.items.map((x) => ({
        text: x.text,
        sub: x.sub || '',
        isDay: x.kind === 'day',
        isTheirs: x.kind === 'theirs',
        isMine: x.kind === 'mine',
        isVideo: x.kind === 'video',
        isCard: x.kind === 'card',
        isTimeLeft: x.kind === 'timeLeft',
        isTimeRight: x.kind === 'timeRight'
      })),
      draft: st.draft,
      empty: !(st.draft || '').trim(),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } },
      send: send
    };
  }
}
</script>
</body>
</html>
