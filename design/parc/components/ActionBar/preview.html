<!-- @dsCard group="Navigation" height=230 subtitle="Barre d'action de la séance, repos en cours puis sans repos" -->
<div style="display:grid;gap:16px;max-width:390px;padding-top:16px">
  <div class="pk-actionbar">
    <div style="display:flex;flex-direction:column;min-width:64px">
      <span class="pk-small">Repos</span>
      <span class="pk-numeral-md" style="color:var(--blue)">1:30</span>
    </div>
    <button type="button" class="pk-btn pk-btn-secondary" aria-label="Ajouter 30 secondes de repos">+30 s</button>
    <button type="button" class="pk-btn pk-btn-primary pk-btn-lg" style="flex:1">Valider la série 3</button>
  </div>
  <div class="pk-actionbar">
    <button type="button" class="pk-btn pk-btn-primary pk-btn-lg" style="flex:1">Confirmer la séance</button>
  </div>
</div>
