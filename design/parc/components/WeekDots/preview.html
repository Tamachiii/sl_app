<!-- @dsCard group="Contenu" height=120 subtitle="La semaine d'un athlète en 7 points" -->
<div style="padding:16px;max-width:390px;box-sizing:border-box">
  <div style="background:var(--surface);border-radius:var(--radius-group);padding:16px;display:grid;gap:14px">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="pk-week" role="img" aria-label="Cette semaine : lundi et mercredi faits, séance prévue aujourd’hui">
        <span class="is-done"></span><span></span><span class="is-done"></span><span class="is-today"></span><span></span><span></span><span></span>
      </span>
      <span class="pk-caption">Fait, fait, aujourd'hui</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="pk-week" role="img" aria-label="Cette semaine : lundi et mardi faits, prochaine séance vendredi">
        <span class="is-done"></span><span class="is-done"></span><span></span><span></span><span class="is-next"></span><span></span><span></span>
      </span>
      <span class="pk-caption">Prochaine vendredi</span>
    </div>
  </div>
</div>
