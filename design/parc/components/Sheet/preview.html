<!-- @dsCard group="Saisie" height=360 subtitle="Feuille du RPE après une série validée" -->
<div style="height:360px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--overlay);max-width:390px">
  <section role="dialog" aria-labelledby="pk-sheet-title" class="pk-sheet">
    <div class="pk-sheet-handle" aria-hidden="true"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <h2 id="pk-sheet-title" class="pk-title">RPE de la série 2</h2>
      <button type="button" class="pk-icon-btn" aria-label="Fermer" style="background:var(--fill)">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <p class="pk-caption" style="margin:4px 0 16px">De 6, facile, à 10, maximal</p>
    <div style="display:grid;grid-template-columns:repeat(5, minmax(0, 1fr));gap:8px">
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">6</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">6,5</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">7</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">7,5</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="true" style="background:var(--blue);color:var(--on-blue);font-size:22px;font-weight:800;min-height:52px;padding:0">8</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">8,5</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">9</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">9,5</button>
      <button type="button" class="pk-btn pk-condensed" aria-pressed="false" style="background:var(--fill);color:var(--ink);font-size:22px;font-weight:800;min-height:52px;padding:0">10</button>
    </div>
  </section>
</div>
