<!-- @dsCard group="Séance" height=374 subtitle="Faite, ratée, en cours, à venir, hors plan" -->
<div style="padding:16px;max-width:390px;box-sizing:border-box">
  <ol aria-label="Séries" class="pk-group">
    <li class="pk-row">
      <span class="pk-set-dot pk-set-dot-done" aria-hidden="true"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
      <div style="flex:1;min-width:0"><div class="pk-body" style="font-weight:600">Série 1, faite</div><div class="pk-caption">5 répétitions, 20 kg</div></div>
      <span style="font-size:15px;font-weight:600">RPE 7,5</span>
    </li>
    <li class="pk-row" style="margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--red-soft)">
      <span class="pk-set-dot pk-set-dot-failed" aria-hidden="true"><svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 6l12 12M18 6L6 18"></path></svg></span>
      <div style="flex:1;min-width:0"><div class="pk-body" style="font-weight:600;color:var(--red)">Série 2, ratée</div><div class="pk-caption">3 répétitions sur 5, 20 kg</div></div>
    </li>
    <li class="pk-row">
      <span class="pk-set-dot pk-set-dot-current" aria-hidden="true">3</span>
      <div style="flex:1;min-width:0"><div class="pk-body" style="font-weight:600">Série 3</div><div class="pk-caption">5 répétitions, 20 kg</div></div>
      <span style="font-size:15px;font-weight:600;color:var(--blue)">En cours</span>
    </li>
    <li class="pk-row">
      <span class="pk-set-dot pk-set-dot-pending" aria-hidden="true">4</span>
      <div style="flex:1;min-width:0"><div class="pk-body" style="font-weight:600">Série 4</div><div class="pk-caption">5 répétitions, 20 kg</div></div>
    </li>
    <li class="pk-row" style="margin:0 -16px;padding-left:16px;padding-right:16px;background:var(--amber-soft);border-radius:0 0 var(--radius-group) var(--radius-group)">
      <span class="pk-set-dot pk-set-dot-done" aria-hidden="true"><svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></span>
      <div style="flex:1;min-width:0"><div class="pk-body" style="font-weight:600">Série 5, ajoutée</div><div class="pk-caption" style="color:var(--amber)">Hors plan, 4 répétitions, 22,5 kg</div></div>
      <span style="font-size:15px;font-weight:600">RPE 9</span>
    </li>
  </ol>
</div>
