<!-- @dsCard group="Séance" height=304 subtitle="La série en cours, lisible à bout de bras" -->
<div style="padding:16px;max-width:390px;box-sizing:border-box">
  <section aria-label="Série en cours" class="pk-panel">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px">
      <h2 class="pk-title">Tractions lestées</h2>
      <span class="pk-subhead" style="white-space:nowrap">Série 3 sur 4</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:16px;margin-top:12px">
      <div>
        <div class="pk-numeral-hero">5</div>
        <div class="pk-subhead" style="margin-top:6px">répétitions</div>
      </div>
      <div>
        <div class="pk-numeral-hero">20</div>
        <div class="pk-subhead" style="margin-top:6px">kg de lest</div>
      </div>
    </div>
    <p class="pk-subhead" style="margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)">Il y a 7 jours, 4 × 5 à 17,5 kg.</p>
  </section>
</div>
