<!-- @dsCard group="Retours" height=166 subtitle="Confirmation avec Annuler, puis erreur" -->
<div style="padding:16px;max-width:390px;box-sizing:border-box;display:grid;gap:10px">
  <div role="status" style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--ink);color:var(--surface);border-radius:var(--radius-control);box-shadow:var(--shadow-toast)">
    <p style="margin:0;flex:1;font-size:15px">Série 4 sautée.</p>
    <button type="button" class="pk-btn" style="background:none;color:#9DB8F5">Annuler</button>
  </div>
  <div role="alert" style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--ink);color:var(--surface);border-radius:var(--radius-control);box-shadow:var(--shadow-toast)">
    <svg width="18" height="18" fill="none" stroke="#FF9A8F" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 6l12 12M18 6L6 18"></path></svg>
    <p style="margin:0;flex:1;font-size:15px">Non enregistré. Vérifie ta connexion et réessaie.</p>
    <button type="button" class="pk-icon-btn" aria-label="Fermer" style="background:none;color:var(--surface)">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
</div>
